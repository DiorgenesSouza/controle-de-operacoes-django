<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excluir operação</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <h3 class="mb-3">
                Confirmar exclusão
            </h3>

            <p>
                Deseja realmente excluir a operação
                <strong>{{ operacao.codigo }}</strong>?
            </p>

            <p class="text-muted">
                O registro ficará inativo e será preservado no banco de dados.
            </p>

            <form method="POST">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Confirmar exclusão
                </button>

                <a
                    href="{% url 'lista_operacoes' %}"
                    class="btn btn-secondary"
                >
                    Cancelar
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
